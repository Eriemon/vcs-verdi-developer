[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vcs-verdi-developer-skill"
version = "0.5.1"
description = "Codex-ready skill for Synopsys VCS simulation, project import, cocotb planning, FSDB tooling, evidence gating, coverage diagnostics, and Verdi workflows."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [
  { name = "Jiyuan Liu", email = "erie@seu.edu.cn" },
  { name = "He Li" },
]
keywords = ["codex-skill", "agent-skill", "vcs", "verdi", "fsdb", "cocotb", "coverage", "regression", "evidence-gate", "rtl-simulation", "eda"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Electronic Design Automation (EDA)",
]

[project.urls]
Homepage = "https://github.com/Eriemon/vcs-verdi-developer"
Repository = "https://github.com/Eriemon/vcs-verdi-developer"

[tool.setuptools]
py-modules = []
