[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vcs-verdi-developer-skill"
version = "0.1.0"
description = "Codex-ready skill for Synopsys VCS simulation and Verdi waveform-debug workflows."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
keywords = ["codex-skill", "agent-skill", "vcs", "verdi", "fsdb", "rtl-simulation", "eda"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Electronic Design Automation (EDA)",
]

[project.urls]
Homepage = "https://github.com/Eriemon/vcs-verdi-developer"
Repository = "https://github.com/Eriemon/vcs-verdi-developer"

[tool.setuptools]
py-modules = []
